name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN permissions required for Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy running at a time; skip intermediate runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # Using `npm install` (not `npm ci`) because the lock file is
        # generated on Windows, which omits Linux-only platform packages
        # for optional deps like sharp (@emnapi/runtime, etc.).
        run: npm install --no-audit --no-fund

      - name: Build (GitHub Pages base path)
        run: npm run build
        env:
          VITE_BASE_PATH: /meme-streeps/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
